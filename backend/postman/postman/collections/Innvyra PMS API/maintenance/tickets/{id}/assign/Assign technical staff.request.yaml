$kind: http-request
description: "Tickets: OPEN → ASSIGNED → IN_PROGRESS → RESOLVED → CLOSED. OPEN/ASSIGNED can be CANCELLED after all linked blocks are ended. Reporting/resolving a ticket never releases inventory. Only the assignee starts/resolves. Required roles: ADMIN, MANAGER. Current hotel only. HOUSEKEEPING sees only assigned tasks; TECHNICIAN sees only assigned tickets. Responses exclude guest data. Mutation bodies reject unknown fields. Actor and hotel come from authentication."
url: "{{baseUrl}}/maintenance/tickets/:id/assign"
method: PATCH
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "301"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unsigned BIGINT decimal string, maximum 18446744073709551615",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "301"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "staffId": "8"
    }
  $type: |-
    {
      "type": "object",
      "example": {
        "staffId": "8"
      },
      "properties": {
        "staffId": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,19}$",
          "example": "301",
          "description": "Unsigned BIGINT decimal string, maximum 18446744073709551615"
        }
      },
      "required": [
        "staffId"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Assign technical staff.resources/examples
order: 1000
