$kind: http-example
request:
  url: "{{baseUrl}}/maintenance/tickets"
  method: POST
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "roomId": "301",
        "title": "Air conditioner malfunction",
        "description": "Air conditioner is not cooling",
        "priority": "HIGH"
      }
response:
  statusCode: 401
  statusText: Unauthorized
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "string",
        "error": {
          "code": "string",
          "details": [
            {
              "path": "string",
              "message": "string"
            },
            {
              "path": "string",
              "message": "string"
            }
          ]
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "message": {
            "type": "string"
          },
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "details": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            },
            "required": [
              "code"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "error"
        ]
      }
order: 3000
