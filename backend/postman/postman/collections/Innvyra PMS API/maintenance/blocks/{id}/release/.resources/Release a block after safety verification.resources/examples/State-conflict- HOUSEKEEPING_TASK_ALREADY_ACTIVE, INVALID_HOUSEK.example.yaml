$kind: http-example
name: "State/conflict: HOUSEKEEPING_TASK_ALREADY_ACTIVE, INVALID_HOUSEKEEPING_TRANSITION, HOUSEKEEPING_TASK_CONFLICT, ROOM_NOT_DIRTY, ROOM_UNDER_MAINTENANCE, ROOM_CURRENTLY_OCCUPIED, INVALID_MAINTENANCE_TRANSITION, MAINTENANCE_BLOCK_CONFLICT, MAINTENANCE_AFFECTS_RESERVATIONS, MAINTENANCE_ALREADY_RELEASED, OPERATIONS_CONFLICT"
request:
  url: "{{baseUrl}}/maintenance/blocks/:id/release"
  method: POST
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "301"
  body:
    type: json
    content: |-
      {
        "notes": "Repair verified safe; room requires cleaning and inspection"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "string",
        "error": {
          "code": "string",
          "details": [
            {
              "path": "string",
              "message": "string"
            },
            {
              "path": "string",
              "message": "string"
            }
          ]
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "message": {
            "type": "string"
          },
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "details": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            },
            "required": [
              "code"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "error"
        ]
      }
order: 6000
