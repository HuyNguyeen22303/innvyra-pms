$kind: http-request
description: "Manual approval by ADMIN/MANAGER/ACCOUNTANT with reason and actual-refund attestation. Cumulative refunds cannot exceed original confirmed receipt or net money received. Bank refunds require outgoing reference. Refund increases outstanding; it never deletes the original payment, reverses a charge or sends bank funds. CLOSED folios reject new refunds. Required roles: ADMIN, MANAGER, ACCOUNTANT. Scope comes from the authenticated staff's current hotel. Unknown fields are rejected."
url: "{{baseUrl}}/payments/:id/refunds"
method: POST
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Idempotency-Key
    value: billing-receipt-0001
    disabled: false
    description: Unique per hotel across payment, refund and adjustment endpoints. Same normalized payload replays original response, even after closing. Different payload/target/operation returns 409. Keys are retained; use a new key only for a new transaction.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 8,
            "maxLength": 128,
            "pattern": "^[A-Za-z0-9][A-Za-z0-9._:-]{7,127}$",
            "example": "billing-receipt-0001"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "101"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unsigned BIGINT, maximum 18446744073709551615",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "101"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "amount": "200000.00",
      "reason": "Manager approved return of deposit",
      "confirmedRefunded": true
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "amount": {
          "type": "string",
          "pattern": "^(0|[1-9][0-9]{0,15})(\\.0{1,2})?$",
          "example": "50000.00",
          "description": "Whole VND Decimal string. Maximum 9999999999999999.00; responses use two decimal places. Positive for receipts/refunds/adjustments."
        },
        "reason": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2000
        },
        "confirmedRefunded": {
          "type": "boolean",
          "enum": [
            true
          ],
          "description": "Staff confirms the actual refund has already occurred."
        },
        "referenceNumber": {
          "type": "string",
          "minLength": 1,
          "maxLength": 100
        }
      },
      "required": [
        "amount",
        "reason",
        "confirmedRefunded"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Record approved actual refund.resources/examples
order: 1000
