$kind: http-request
description: "Roles: ADMIN, MANAGER. Resets employee password and revokes all active sessions. Password is encrypted with Argon2id before storage. Does not expose password or secrets in response or logs. Role hierarchy enforced."
url: "{{baseUrl}}/employees/:id/reset-password"
method: POST
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "10"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unsigned BIGINT decimal string",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "10"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "password": "Innvyra@NewSecure2026!"
    }
  $type: |-
    {
      "description": "Optional. If omitted, a cryptographically secure random temporary password is automatically generated.",
      "type": "object",
      "properties": {
        "password": {
          "type": "string",
          "minLength": 15,
          "maxLength": 128
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Reset employee password.resources/examples
order: 1000
