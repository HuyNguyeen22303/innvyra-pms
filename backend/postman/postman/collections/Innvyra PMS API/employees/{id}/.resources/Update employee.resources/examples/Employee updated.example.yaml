$kind: http-example
request:
  url: "{{baseUrl}}/employees/:id"
  method: PATCH
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "10"
  body:
    type: json
    content: |-
      {
        "fullName": "Nguyễn Minh Anh Updated"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Employee updated",
        "data": {
          "id": "10",
          "fullName": "Nguyễn Minh Anh",
          "username": "minhanh",
          "email": "minhanh@example.test",
          "role": "RECEPTIONIST",
          "isActive": true,
          "createdAt": "2026-10-16T00:00:00.000Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "example": {
              "id": "10",
              "fullName": "Nguyễn Minh Anh",
              "username": "minhanh",
              "email": "minhanh@example.test",
              "role": "RECEPTIONIST",
              "isActive": true,
              "createdAt": "2026-10-16T00:00:00.000Z"
            },
            "properties": {
              "id": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "10",
                "description": "Unsigned BIGINT decimal string"
              },
              "fullName": {
                "type": "string",
                "minLength": 1,
                "maxLength": 191
              },
              "username": {
                "type": "string",
                "minLength": 3,
                "maxLength": 64
              },
              "email": {
                "type": "string",
                "maxLength": 191,
                "format": "email"
              },
              "role": {
                "type": "string",
                "enum": [
                  "ADMIN",
                  "MANAGER",
                  "RECEPTIONIST",
                  "HOUSEKEEPING",
                  "ACCOUNTANT",
                  "TECHNICIAN"
                ]
              },
              "isActive": {
                "type": "boolean"
              },
              "createdAt": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "fullName",
              "username",
              "email",
              "role",
              "isActive",
              "createdAt"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
