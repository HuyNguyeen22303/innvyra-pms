$kind: http-example
request:
  url: "{{baseUrl}}/employees?page=1&limit=20&search=string&role=ACCOUNTANT&isActive=true&sortBy=fullName&sortOrder=asc"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number
    - key: limit
      value: "20"
      disabled: false
      description: Bounded page size
    - key: search
      value: string
      disabled: false
      description: Search by fullName, username or email
    - key: role
      value: ACCOUNTANT
      disabled: false
      description: Filter by role
    - key: isActive
      value: "true"
      disabled: false
      description: Filter by active status; omit to include all
    - key: sortBy
      value: fullName
      disabled: false
      description: Sort whitelist
    - key: sortOrder
      value: asc
      disabled: false
      description: Sort direction
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Employees retrieved",
        "data": {
          "items": [
            {
              "id": "10",
              "fullName": "Nguyễn Minh Anh",
              "username": "minhanh",
              "email": "minhanh@example.test",
              "role": "RECEPTIONIST",
              "isActive": true,
              "createdAt": "2026-10-16T00:00:00.000Z"
            }
          ],
          "pagination": {
            "total": 1,
            "page": 1,
            "limit": 20,
            "totalPages": 1
          }
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "items": {
                "type": "array",
                "items": {
                  "type": "object",
                  "example": {
                    "id": "10",
                    "fullName": "Nguyễn Minh Anh",
                    "username": "minhanh",
                    "email": "minhanh@example.test",
                    "role": "RECEPTIONIST",
                    "isActive": true,
                    "createdAt": "2026-10-16T00:00:00.000Z"
                  },
                  "properties": {
                    "id": {
                      "type": "string",
                      "pattern": "^[1-9][0-9]{0,19}$",
                      "example": "10",
                      "description": "Unsigned BIGINT decimal string"
                    },
                    "fullName": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 191
                    },
                    "username": {
                      "type": "string",
                      "minLength": 3,
                      "maxLength": 64
                    },
                    "email": {
                      "type": "string",
                      "maxLength": 191,
                      "format": "email"
                    },
                    "role": {
                      "type": "string",
                      "enum": [
                        "ADMIN",
                        "MANAGER",
                        "RECEPTIONIST",
                        "HOUSEKEEPING",
                        "ACCOUNTANT",
                        "TECHNICIAN"
                      ]
                    },
                    "isActive": {
                      "type": "boolean"
                    },
                    "createdAt": {
                      "type": "string",
                      "format": "date-time"
                    }
                  },
                  "required": [
                    "id",
                    "fullName",
                    "username",
                    "email",
                    "role",
                    "isActive",
                    "createdAt"
                  ]
                }
              },
              "pagination": {
                "type": "object",
                "properties": {
                  "page": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "limit": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100
                  },
                  "total": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "totalPages": {
                    "type": "integer",
                    "minimum": 0
                  }
                },
                "required": [
                  "page",
                  "limit",
                  "total",
                  "totalPages"
                ]
              }
            },
            "required": [
              "items",
              "pagination"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
