$kind: http-example
name: Role denied, CSRF/Origin rejected, or role hierarchy violation
request:
  url: "{{baseUrl}}/employees?page=1&limit=20&search=string&role=ACCOUNTANT&isActive=true&sortBy=fullName&sortOrder=asc"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number
    - key: limit
      value: "20"
      disabled: false
      description: Bounded page size
    - key: search
      value: string
      disabled: false
      description: Search by fullName, username or email
    - key: role
      value: ACCOUNTANT
      disabled: false
      description: Filter by role
    - key: isActive
      value: "true"
      disabled: false
      description: Filter by active status; omit to include all
    - key: sortBy
      value: fullName
      disabled: false
      description: Sort whitelist
    - key: sortOrder
      value: asc
      disabled: false
      description: Sort direction
  body:
    type: text
    content: ""
response:
  statusCode: 403
  statusText: Forbidden
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "string",
        "error": {
          "code": "string",
          "details": [
            {
              "path": "string",
              "message": "string"
            },
            {
              "path": "string",
              "message": "string"
            }
          ]
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "message": {
            "type": "string"
          },
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "details": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            },
            "required": [
              "code"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "error"
        ]
      }
order: 3000
