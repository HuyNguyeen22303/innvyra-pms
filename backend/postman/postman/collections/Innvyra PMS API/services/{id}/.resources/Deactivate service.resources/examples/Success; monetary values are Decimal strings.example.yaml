  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Deactivate service",
        "data": {
          "id": "1",
          "hotelId": "1",
          "code": "LAUNDRY",
          "name": "Laundry",
          "unit": "item",
          "price": "50000.00",
          "description": null,
          "isActive": false,
          "createdAt": "2026-10-15T00:00:00.000Z",
          "updatedAt": "2026-10-15T00:00:00.000Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
