$kind: http-example
request:
  url: "{{baseUrl}}/services/:id"
  method: DELETE
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "101"
  body:
    type: json
    content: "{}"
