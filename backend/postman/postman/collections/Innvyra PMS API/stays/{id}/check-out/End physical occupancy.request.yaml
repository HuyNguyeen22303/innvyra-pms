$kind: http-request
description: ADMIN, MANAGER, RECEPTIONIST. Physical departure only; payment/settlement is not verified. Any time at or after actual check-in (including early/late departure). Atomically ends stay, releases occupancy and sets room DIRTY. Keeps all inventory nights, prices, assignments and history. All rooms ended sets CHECKED_OUT. Repeated checkout returns 409. Send {} when no notes.
url: "{{baseUrl}}/stays/:id/check-out"
method: POST
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "301"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Internal unsigned BIGINT ID, maximum 18446744073709551615; not a room number",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "301"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "notes": "Guest returned room key"
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "notes": {
          "type": "string",
          "maxLength": 2000
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/End physical occupancy.resources/examples
order: 1000
