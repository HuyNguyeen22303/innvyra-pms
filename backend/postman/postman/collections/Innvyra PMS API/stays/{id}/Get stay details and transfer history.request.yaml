$kind: http-request
description: ADMIN, MANAGER, RECEPTIONIST and ACCOUNTANT. Hotel scoped. ACCOUNTANT does not receive guest, staff, notes or transfer history. No financial settlement claim is made.
url: "{{baseUrl}}/stays/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "301"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Internal unsigned BIGINT ID, maximum 18446744073709551615; not a room number",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "301"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Get stay details and transfer history.resources/examples
order: 1000
