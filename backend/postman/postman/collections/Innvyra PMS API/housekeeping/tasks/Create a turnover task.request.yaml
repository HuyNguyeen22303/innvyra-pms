$kind: http-request
description: "Turnover MVP: DIRTY → CLEANING → INSPECTION → READY. Failed inspection requires notes, returns PENDING/DIRTY and retains audit history. Only the assignee starts/completes; ADMIN/MANAGER inspect. Occupancy is derived independently from active stays. No stayover cleaning. Required roles: ADMIN, MANAGER, RECEPTIONIST. Current hotel only. HOUSEKEEPING sees only assigned tasks; TECHNICIAN sees only assigned tickets. Responses exclude guest data. Mutation bodies reject unknown fields. Actor and hotel come from authentication."
url: "{{baseUrl}}/housekeeping/tasks"
method: POST
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "roomId": "301",
      "taskType": "TURNOVER_CLEANING",
      "priority": "NORMAL",
      "notes": "Prepare room for next guest"
    }
  $type: |-
    {
      "type": "object",
      "example": {
        "roomId": "301",
        "taskType": "TURNOVER_CLEANING",
        "priority": "NORMAL",
        "notes": "Prepare room for next guest"
      },
      "properties": {
        "roomId": {
          "type": "string",
          "pattern": "^[1-9][0-9]{0,19}$",
          "example": "301",
          "description": "Unsigned BIGINT decimal string, maximum 18446744073709551615"
        },
        "taskType": {
          "type": "string",
          "enum": [
            "TURNOVER_CLEANING"
          ]
        },
        "priority": {
          "type": "string",
          "enum": [
            "LOW",
            "NORMAL",
            "HIGH",
            "URGENT"
          ]
        },
        "notes": {
          "type": "string",
          "minLength": 1,
          "maxLength": 2000
        }
      },
      "required": [
        "roomId"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Create a turnover task.resources/examples
order: 2000
