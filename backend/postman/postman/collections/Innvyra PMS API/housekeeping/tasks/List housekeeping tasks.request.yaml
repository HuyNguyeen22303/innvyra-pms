$kind: http-request
description: "Turnover MVP: DIRTY → CLEANING → INSPECTION → READY. Failed inspection requires notes, returns PENDING/DIRTY and retains audit history. Only the assignee starts/completes; ADMIN/MANAGER inspect. Occupancy is derived independently from active stays. No stayover cleaning. Required roles: ADMIN, MANAGER, RECEPTIONIST, HOUSEKEEPING. Current hotel only. HOUSEKEEPING sees only assigned tasks; TECHNICIAN sees only assigned tickets. Responses exclude guest data. Mutation bodies reject unknown fields. Actor and hotel come from authentication."
url: "{{baseUrl}}/housekeeping/tasks?page=1&limit=20&sortOrder=asc&status=IN_PROGRESS&priority=NORMAL&roomId=301&assignedTo=301&taskType=TURNOVER_CLEANING&floorNumber=3201&sortBy=createdAt"
