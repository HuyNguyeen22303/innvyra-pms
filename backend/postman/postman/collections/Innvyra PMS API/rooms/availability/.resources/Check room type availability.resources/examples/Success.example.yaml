$kind: http-example
request:
  url: "{{baseUrl}}/rooms/availability?checkInDate=2026-10-20&checkOutDate=2026-10-20&adults=1&children=0&roomTypeId=12"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: checkInDate
      value: 2026-10-20
      disabled: false
      description: Hotel-local DATE
    - key: checkOutDate
      value: 2026-10-20
      disabled: false
      description: Exclusive departure date
    - key: adults
      value: "1"
      disabled: false
      description: Adults per room
    - key: children
      value: "0"
      disabled: false
      description: Children per room
    - key: roomTypeId
      value: "12"
      disabled: false
      description: Optional scoped room type; missing/inactive yields 404/409
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Success",
        "data": [
          {
            "roomTypeId": "2",
            "roomTypeName": "Deluxe",
            "availableRooms": 3,
            "basePrice": "900000.00",
            "estimatedTotalPerRoom": "1800000.00",
            "currency": "VND"
          }
        ]
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "array",
            "items": {
              "type": "object",
              "properties": {
                "roomTypeId": {
                  "type": "string",
                  "pattern": "^[1-9][0-9]{0,19}$",
                  "example": "12",
                  "description": "Unsigned BIGINT as decimal string"
                },
                "roomTypeName": {
                  "type": "string"
                },
                "availableRooms": {
                  "type": "integer",
                  "minimum": 0
                },
                "basePrice": {
                  "type": "string",
                  "pattern": "^\\d+\\.\\d{2}$",
                  "example": "900000.00"
                },
                "estimatedTotalPerRoom": {
                  "type": "string",
                  "pattern": "^\\d+\\.\\d{2}$",
                  "example": "900000.00"
                },
                "currency": {
                  "type": "string",
                  "enum": [
                    "VND"
                  ]
                }
              },
              "required": [
                "roomTypeId",
                "roomTypeName",
                "availableRooms",
                "basePrice",
                "estimatedTotalPerRoom",
                "currency"
              ]
            }
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
