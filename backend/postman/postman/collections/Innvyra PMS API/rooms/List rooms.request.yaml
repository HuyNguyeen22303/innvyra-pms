queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Decimal integer 1–1000000; default 1.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1,
            "maximum": 1000000
          }
        }
      }
  - key: limit
    value: "20"
    disabled: false
    description: Decimal integer 1–100; default 20.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
  - key: search
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 20
          }
        }
      }
  - key: isActive
    value: "false"
    disabled: false
    description: Literal true or false. Omitted includes active and inactive records.
    $type: boolean
  - key: sortOrder
    value: asc
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "asc",
            "enum": [
              "asc",
              "desc"
            ]
          }
        }
      }
  - key: roomTypeId
    value: "637531104767522725"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "pattern": "^[1-9]\\d{0,19}$"
          }
        }
      }
  - key: floorNumber
    value: "-12691"
    disabled: false
    description: Signed SMALLINT, -32768–32767; includes basement floors.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "minimum": -32768,
            "maximum": 32767
          }
        }
      }
  - key: physicalStatus
    value: MAINTENANCE
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "ACTIVE",
              "OUT_OF_SERVICE",
              "MAINTENANCE"
            ]
          }
        }
      }
  - key: housekeepingStatus
    value: CLEANING
    disabled: false
