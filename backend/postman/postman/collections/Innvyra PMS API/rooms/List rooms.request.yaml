    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "DIRTY",
              "CLEANING",
              "INSPECTION",
              "READY"
            ]
          }
        }
      }
  - key: sortBy
    value: roomNumber
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "roomNumber",
            "enum": [
              "roomNumber",
              "floorNumber",
              "createdAt"
            ]
          }
