$kind: http-request
description: "Roles: ADMIN, MANAGER. Hotel comes only from the authenticated user. Other roles receive 403. POST/PATCH/DELETE require X-CSRF-Protection: 1. No hard delete and no reservation/stay records are modified. Sets isActive=false and retains the record and references. Repeating succeeds when no active operations prevent it. Changes reducing capacity are checked against reservations plus maintenance blocks for every current/future night under the hotel lock. Occupied rooms cannot be deactivated or change type. Live Operations records prevent status/type bypass. READY/CLEANING/INSPECTION require the Housekeeping workflow; MAINTENANCE requires a block."
url: "{{baseUrl}}/rooms/:id"
method: DELETE
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: Required for writes; browser Origin must be allowlisted.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Positive unsigned BIGINT, maximum 18446744073709551615",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "1"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Deactivate Room (record retained).resources/examples
order: 3000
