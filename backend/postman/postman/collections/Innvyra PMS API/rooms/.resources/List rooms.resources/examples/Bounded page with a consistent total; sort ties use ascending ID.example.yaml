$kind: http-example
name: Bounded page with a consistent total; sort ties use ascending ID.
request:
  url: "{{baseUrl}}/rooms?page=1&limit=20&search=string&isActive=true&sortOrder=asc&roomTypeId=43638765395&floorNumber=3201&physicalStatus=OUT_OF_SERVICE&housekeepingStatus=CLEANING&sortBy=roomNumber"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Decimal integer 1–1000000; default 1.
    - key: limit
      value: "20"
      disabled: false
      description: Decimal integer 1–100; default 20.
    - key: search
      value: string
      disabled: false
      description: ""
    - key: isActive
      value: "true"
      disabled: false
      description: Literal true or false. Omitted includes active and inactive records.
    - key: sortOrder
      value: asc
      disabled: false
      description: ""
    - key: roomTypeId
      value: "43638765395"
      disabled: false
      description: ""
    - key: floorNumber
      value: "3201"
      disabled: false
      description: Signed SMALLINT, -32768–32767; includes basement floors.
    - key: physicalStatus
      value: OUT_OF_SERVICE
      disabled: false
      description: ""
    - key: housekeepingStatus
      value: CLEANING
      disabled: false
      description: ""
    - key: sortBy
      value: roomNumber
      disabled: false
      description: ""
  body:
    type: text
    content: ""
