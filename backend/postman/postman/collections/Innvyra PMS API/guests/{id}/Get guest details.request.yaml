$kind: http-request
description: "Roles: ADMIN, MANAGER, RECEPTIONIST, ACCOUNTANT. Every role, including ADMIN, is scoped to the current hotel from the authenticated session. ACCOUNTANT receives only id/fullName and cannot filter by nationality. HOUSEKEEPING and TECHNICIAN receive 403. Soft-deleted and foreign-hotel IDs have the same 404 as unknown IDs. Cache-Control: no-store. ADMIN, MANAGER and RECEPTIONIST may read full operational detail including decrypted document number."
url: "{{baseUrl}}/guests/:id"
method: GET
headers:
  Accept: application/json
pathVariables:
  - key: id
    value: "42"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unsigned BIGINT decimal string, maximum 18446744073709551615",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "42"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Get guest details.resources/examples
order: 1000
