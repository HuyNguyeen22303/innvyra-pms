$kind: http-example
request:
  url: "{{baseUrl}}/folios/:id/adjustments"
  method: POST
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Idempotency-Key
      value: billing-receipt-0001
      disabled: false
      description: Unique per hotel across payment, refund and adjustment endpoints. Same normalized payload replays original response, even after closing. Different payload/target/operation returns 409. Keys are retained; use a new key only for a new transaction.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "101"
  body:
    type: json
    content: |-
      {
        "entryType": "CREDIT",
        "amount": "100000.00",
        "reason": "Service compensation"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Record folio adjustment",
        "data": {
          "id": "1",
          "folioId": "1",
          "entryType": "CREDIT",
          "sourceType": "MANUAL_ADJUSTMENT",
          "sourceId": null,
          "amount": "100000.00",
          "description": "Service compensation",
          "relatedItemId": null,
          "createdBy": "1",
          "createdAt": "2026-10-15T00:00:00.000Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "101",
                "description": "Unsigned BIGINT, maximum 18446744073709551615"
              },
              "folioId": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "101",
                "description": "Unsigned BIGINT, maximum 18446744073709551615"
              },
              "entryType": {
                "type": "string",
                "enum": [
                  "DEBIT",
                  "CREDIT"
                ]
              },
              "sourceType": {
                "type": "string",
