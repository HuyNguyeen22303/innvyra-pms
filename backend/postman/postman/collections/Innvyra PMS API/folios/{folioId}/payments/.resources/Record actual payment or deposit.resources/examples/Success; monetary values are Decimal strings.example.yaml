$kind: http-example
request:
  url: "{{baseUrl}}/folios/:folioId/payments"
  method: POST
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Idempotency-Key
      value: billing-receipt-0001
      disabled: false
      description: Unique per hotel across payment, refund and adjustment endpoints. Same normalized payload replays original response, even after closing. Different payload/target/operation returns 409. Keys are retained; use a new key only for a new transaction.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    folioId: "101"
  body:
    type: json
    content: |-
      {
        "paymentType": "PAYMENT",
        "paymentMethod": "CASH",
        "amount": "1000000.00",
        "confirmedReceived": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Record actual payment or deposit",
        "data": {
          "id": "1",
          "folioId": "1",
          "paymentType": "PAYMENT",
          "paymentMethod": "CASH",
          "amount": "1000000.00",
          "status": "CONFIRMED",
          "referenceNumber": null,
          "originalPaymentId": null,
          "reason": null,
          "processedBy": "1",
          "processedAt": "2026-10-15T00:00:00.000Z",
          "createdAt": "2026-10-15T00:00:00.000Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "101",
                "description": "Unsigned BIGINT, maximum 18446744073709551615"
              },
              "folioId": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "101",
                "description": "Unsigned BIGINT, maximum 18446744073709551615"
              },
              "paymentType": {
                "type": "string",
                "enum": [
                  "PAYMENT",
                  "DEPOSIT",
                  "REFUND"
                ]
              },
              "paymentMethod": {
                "type": "string",
                "enum": [
                  "CASH",
                  "BANK_TRANSFER"
                ]
              },
              "amount": {
                "type": "string",
                "pattern": "^(0|[1-9][0-9]{0,15})(\\.0{1,2})?$",
                "example": "50000.00",
                "description": "Whole VND Decimal string. Maximum 9999999999999999.00; responses use two decimal places. Positive for receipts/refunds/adjustments."
              },
              "status": {
                "type": "string",
                "enum": [
                  "CONFIRMED",
                  "PENDING",
                  "FAILED"
                ]
              },
              "referenceNumber": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100
              },
              "originalPaymentId": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "101",
                "description": "Unsigned BIGINT, maximum 18446744073709551615"
              },
              "reason": {
                "type": "string",
                "maxLength": 2000
              },
              "processedBy": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "101",
                "description": "Unsigned BIGINT, maximum 18446744073709551615"
              },
              "processedAt": {
                "type": "string",
                "format": "date-time"
              },
              "createdAt": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "folioId",
              "paymentType",
              "paymentMethod",
              "amount",
              "status",
              "referenceNumber",
              "originalPaymentId",
              "reason",
              "processedBy",
              "processedAt",
              "createdAt"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
