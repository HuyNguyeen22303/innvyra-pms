$kind: http-example
request:
  url: "{{baseUrl}}/reservations/:id/no-show"
  method: POST
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "12"
  body:
    type: json
    content: |-
      {
        "reason": "Guest did not arrive"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Success",
        "data": {
          "id": "101",
          "status": "NO_SHOW"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "12",
                "description": "Unsigned BIGINT as decimal string"
              },
              "status": {
                "type": "string",
                "enum": [
                  "NO_SHOW"
                ]
              }
            },
            "required": [
              "id",
              "status"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
