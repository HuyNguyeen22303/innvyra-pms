$kind: http-request
description: "Roles: ADMIN, MANAGER, RECEPTIONIST, ACCOUNTANT. Hotel scoped. search matches confirmation code; guestSearch matches guest name and is forbidden for ACCOUNTANT. Date filters are exact dates. Summary excludes nightly rows, private notes and identity documents. Pagination follows the existing data.items/data.pagination convention."
url: "{{baseUrl}}/reservations?page=1&limit=20&search=string&guestId=12&guestSearch=string&status=CANCELLED&checkInDate=2026-10-20&checkOutDate=2026-10-20&bookingSource=DIRECT&sortBy=createdAt&sortOrder=desc"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1,
            "maximum": 1000000
          }
        }
      }
  - key: limit
    value: "20"
    disabled: false
    description: Page size
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
  - key: search
    value: string
    disabled: false
    description: Confirmation code contains
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "maxLength": 32
          }
        }
      }
  - key: guestId
    value: "12"
    disabled: false
    description: Booker ID
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unsigned BIGINT as decimal string",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "12"
          }
        }
      }
  - key: guestSearch
    value: string
    disabled: false
    description: Guest name contains; front desk roles only
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "maxLength": 150
          }
        }
      }
  - key: status
    value: CANCELLED
    disabled: false
    description: Reservation status
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "CONFIRMED",
              "CANCELLED",
              "CHECKED_IN",
              "CHECKED_OUT",
              "NO_SHOW",
              "PARTIALLY_CHECKED_IN"
            ]
          }
        }
      }
  - key: checkInDate
    value: 2026-10-20
    disabled: false
    description: Exact check-in date
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date",
            "example": "2026-10-20"
          }
        }
      }
  - key: checkOutDate
    value: 2026-10-20
    disabled: false
    description: Exact check-out date
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date",
            "example": "2026-10-20"
          }
        }
      }
  - key: bookingSource
    value: DIRECT
    disabled: false
    description: Booking channel
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "DIRECT",
            "enum": [
              "DIRECT",
              "PHONE",
              "EMAIL",
              "WALK_IN",
              "AGENT",
              "OTHER"
            ]
          }
        }
      }
  - key: sortBy
    value: createdAt
    disabled: false
    description: Sort field
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "createdAt",
            "enum": [
              "createdAt",
              "checkInDate",
              "checkOutDate",
              "totalAmount",
              "confirmationCode"
            ]
          }
        }
      }
  - key: sortOrder
    value: desc
    disabled: false
    description: Sort direction
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "desc",
            "enum": [
              "asc",
              "desc"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/List reservations.resources/examples
order: 1000
