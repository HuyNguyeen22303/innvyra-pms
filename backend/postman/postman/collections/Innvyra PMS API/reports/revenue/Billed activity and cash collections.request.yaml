$kind: http-request
description: "Net Billed Charges = total debits − total credits; not recognized accounting revenue. Net Cash Collected = confirmed payments + deposits − refunds. Balance movement = period billed − period cash. Balance = all ledger entries before endDate cutoff (capped at generatedAt), including entries before startDate. Charges group by postedAt (FolioItem.createdAt); cash groups by Payment.processedAt confirmation time. Deposits are cash, not room sales. Required roles: ADMIN, MANAGER, ACCOUNTANT. Hotel scope comes from the authenticated session; hotelId/role query fields are rejected. Read-only consistent snapshot, no guest PII."
url: "{{baseUrl}}/reports/revenue?startDate=2018-07-12&endDate=2018-07-12&groupBy=day"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: startDate
    value: 2018-07-12
    disabled: false
    description: Inclusive hotel business date.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: endDate
    value: 2018-07-12
    disabled: false
    description: Exclusive hotel business date; startDate < endDate, default maximum 366 days, configurable by REPORT_MAX_DAYS.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: groupBy
    value: day
    disabled: false
    description: Hotel calendar grouping; month label YYYY-MM-01. Partial months include only requested days. Missing buckets are zero-filled; unavailable values stay null.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "day",
            "enum": [
              "day",
              "month"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Billed activity and cash collections.resources/examples
order: 1000
