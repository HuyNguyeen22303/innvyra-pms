$kind: http-example
name: Sanitized internal error; no SQL or stack trace.
request:
  url: "{{baseUrl}}/reports/revenue?startDate=1995-05-14&endDate=1995-05-14&groupBy=day"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: startDate
      value: 1995-05-14
      disabled: false
      description: Inclusive hotel business date.
    - key: endDate
      value: 1995-05-14
      disabled: false
      description: Exclusive hotel business date; startDate < endDate, default maximum 366 days, configurable by REPORT_MAX_DAYS.
    - key: groupBy
      value: day
      disabled: false
      description: Hotel calendar grouping; month label YYYY-MM-01. Partial months include only requested days. Missing buckets are zero-filled; unavailable values stay null.
