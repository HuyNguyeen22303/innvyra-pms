$kind: http-request
description: "Total purchase costs from stock receipts, aggregated by category, supplier, and top items. Charts/groups by category, supplier share, and top 10 highest-cost items. startDate inclusive, endDate exclusive hotel-local dates. Optional supplierId or categoryId filters refine all sections. Summary includes total expense, receipt count, average receipt value, total items purchased and top supplier. Percentages use exact Money arithmetic rounded to 2 decimal places. Required roles: ADMIN, MANAGER, ACCOUNTANT. Hotel scope comes from the authenticated session; hotelId/role query fields are rejected. Read-only consistent snapshot, no guest PII."
url: "{{baseUrl}}/reports/procurement?startDate=1948-02-03&endDate=1948-02-03&groupBy=day&supplierId=556261551675844825&categoryId=556261551675844825"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: startDate
    value: 1948-02-03
    disabled: false
    description: Inclusive hotel business date.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: endDate
    value: 1948-02-03
    disabled: false
    description: Exclusive hotel business date; startDate < endDate, default maximum 366 days, configurable by REPORT_MAX_DAYS.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: groupBy
    value: day
    disabled: false
    description: Hotel calendar grouping; month label YYYY-MM-01. Partial months include only requested days. Missing buckets are zero-filled; unavailable values stay null.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "day",
            "enum": [
              "day",
              "month"
            ]
          }
        }
      }
  - key: supplierId
    value: "556261551675844825"
    disabled: false
    description: Filter by supplier; applies to series, category breakdown and top items.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "pattern": "^[1-9]\\d{0,19}$"
          }
        }
      }
  - key: categoryId
    value: "556261551675844825"
    disabled: false
    description: Filter by inventory category; applies to series and supplier breakdown.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "pattern": "^[1-9]\\d{0,19}$"
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Procurement expense summary.resources/examples
order: 1000
