$kind: http-request
description: "CONFIRMED only. Payment count excludes deposits/refunds, which have separate counts. Cash/bank totals include payments + deposits, before refunds. Net Cash Collected = payments + deposits − refunds. Balance is cumulative, unfiltered by paymentMethod. Required roles: ADMIN, MANAGER, ACCOUNTANT. Hotel scope comes from the authenticated session; hotelId/role query fields are rejected. Read-only consistent snapshot, no guest PII."
url: "{{baseUrl}}/reports/payments?startDate=1965-07-06&endDate=1965-07-06&groupBy=day&paymentMethod=BANK_TRANSFER"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: startDate
    value: 1965-07-06
    disabled: false
    description: Inclusive hotel business date.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: endDate
    value: 1965-07-06
    disabled: false
    description: Exclusive hotel business date; startDate < endDate, default maximum 366 days, configurable by REPORT_MAX_DAYS.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: groupBy
    value: day
    disabled: false
    description: Hotel calendar grouping; month label YYYY-MM-01. Partial months include only requested days. Missing buckets are zero-filled; unavailable values stay null.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "day",
            "enum": [
              "day",
              "month"
            ]
          }
        }
      }
  - key: paymentMethod
    value: BANK_TRANSFER
    disabled: false
    description: Filters cash activity only. Cumulative balance always includes ALL methods.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "enum": [
              "CASH",
              "BANK_TRANSFER"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Payment and refund statistics.resources/examples
order: 1000
