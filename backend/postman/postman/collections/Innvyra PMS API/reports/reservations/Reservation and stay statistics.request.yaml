$kind: http-request
description: "Created counts use createdAt; cancellation uses cancelledAt; actual check-in/out use Stay timestamps. Reservation rooms are distinct from orders. Confirmed/no-show counts use current status in the creation cohort, not transition dates. Expected arrivals/departures are remaining scheduled rooms at generation time, not reconstructed historical forecasts. Booking-source breakdown covers created orders. Required roles: ADMIN, MANAGER, RECEPTIONIST. Hotel scope comes from the authenticated session; hotelId/role query fields are rejected. Read-only consistent snapshot, no guest PII."
url: "{{baseUrl}}/reports/reservations?startDate=1965-07-06&endDate=1965-07-06&groupBy=day"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: startDate
    value: 1965-07-06
    disabled: false
    description: Inclusive hotel business date.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: endDate
    value: 1965-07-06
    disabled: false
    description: Exclusive hotel business date; startDate < endDate, default maximum 366 days, configurable by REPORT_MAX_DAYS.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: groupBy
    value: day
    disabled: false
    description: Hotel calendar grouping; month label YYYY-MM-01. Partial months include only requested days. Missing buckets are zero-filled; unavailable values stay null.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "day",
            "enum": [
              "day",
              "month"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Reservation and stay statistics.resources/examples
order: 1000
