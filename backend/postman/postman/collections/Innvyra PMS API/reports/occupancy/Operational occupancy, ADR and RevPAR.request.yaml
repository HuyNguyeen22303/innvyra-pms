$kind: http-request
description: "Occupancy Rate = occupied / estimated sellable room nights × 100 (2 decimals). Operational ADR = occupied-night snapshot value / occupied nights. Operational RevPAR = same value / estimated sellable nights = unrounded ADR × occupancy fraction. Zero denominator returns null. Room-night cutoff is next local midnight, transfers counted once; early checkout stops actual nights. Missing prices and unclosed nights return null. Historical capacity excludes known maintenance until explicit release, including overdue blocks. Room activation/status/type history is incomplete: capacity and RevPAR are estimates, outOfServiceRoomNights=null. Current ACTIVE status is never applied backwards. Unallocated adjustments/taxes are not inferred. Receptionist response omits roomSalesValue, operationalAdr, operationalRevpar. Required roles: ADMIN, MANAGER, RECEPTIONIST. Hotel scope comes from the authenticated session; hotelId/role query fields are rejected. Read-only consistent snapshot, no guest PII."
url: "{{baseUrl}}/reports/occupancy?startDate=2018-07-12&endDate=2018-07-12&groupBy=day&roomTypeId=796483838290050180"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: startDate
    value: 2018-07-12
    disabled: false
    description: Inclusive hotel business date.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: endDate
    value: 2018-07-12
    disabled: false
    description: Exclusive hotel business date; startDate < endDate, default maximum 366 days, configurable by REPORT_MAX_DAYS.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: groupBy
    value: day
    disabled: false
    description: Hotel calendar grouping; month label YYYY-MM-01. Partial months include only requested days. Missing buckets are zero-filled; unavailable values stay null.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "day",
            "enum": [
              "day",
              "month"
            ]
          }
        }
      }
  - key: roomTypeId
    value: "796483838290050180"
    disabled: false
    description: Must belong to authenticated hotel; foreign IDs return 404.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$"
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Operational occupancy, ADR and RevPAR.resources/examples
order: 1000
