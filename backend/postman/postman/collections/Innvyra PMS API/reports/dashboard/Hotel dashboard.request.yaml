$kind: http-request
description: "date defaults to hotel-local today. Rooms are a current snapshot only; another date returns rooms=null. Occupancy derives from active occupancy/Stay, not housekeeping. Receptionist response omits finance. currentGuestsCount=null because no actual guest-count history exists. Required roles: ADMIN, MANAGER, RECEPTIONIST. Hotel scope comes from the authenticated session; hotelId/role query fields are rejected. Read-only consistent snapshot, no guest PII."
url: "{{baseUrl}}/reports/dashboard?date=1995-05-14"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: date
    value: 1995-05-14
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Hotel dashboard.resources/examples
order: 1000
