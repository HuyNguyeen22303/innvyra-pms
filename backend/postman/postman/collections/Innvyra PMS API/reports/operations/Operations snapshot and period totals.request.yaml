$kind: http-request
description: "Snapshots are current at snapshotAt. Period completed/inspected housekeeping totals count distinct tasks with retained TASK_COMPLETE / INSPECTION_PASSED audit events. Maintenance room-nights use explicit releases and deduplicate overlapping blocks. HOUSEKEEPING receives only housekeeping; TECHNICIAN receives only maintenance. Other authorized roles receive both. Required roles: ADMIN, MANAGER, RECEPTIONIST, HOUSEKEEPING, TECHNICIAN. Hotel scope comes from the authenticated session; hotelId/role query fields are rejected. Read-only consistent snapshot, no guest PII."
url: "{{baseUrl}}/reports/operations?startDate=2019-09-17&endDate=2019-09-17&groupBy=day"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: startDate
    value: 2019-09-17
    disabled: false
    description: Inclusive hotel business date.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: endDate
    value: 2019-09-17
    disabled: false
    description: Exclusive hotel business date; startDate < endDate, default maximum 366 days, configurable by REPORT_MAX_DAYS.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "format": "date"
          }
        },
        "required": [
          "value"
        ]
      }
  - key: groupBy
    value: day
    disabled: false
    description: Hotel calendar grouping; month label YYYY-MM-01. Partial months include only requested days. Missing buckets are zero-filled; unavailable values stay null.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "day",
            "enum": [
              "day",
              "month"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Operations snapshot and period totals.resources/examples
order: 1000
