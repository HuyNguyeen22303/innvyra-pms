      value: "1"
      disabled: false
      description: Required custom header for CSRF protection on mutating requests.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "department": "HOUSEKEEPING",
        "items": [
          {
            "itemId": "1",
            "quantity": "20.00",
            "notes": "string"
          }
        ],
        "issueNumber": "ISS-20261018-001",
        "issueDate": "1957-08-21T13:04:25.398Z",
        "purpose": "Daily turnover replenishment",
        "notes": "string"
      }
