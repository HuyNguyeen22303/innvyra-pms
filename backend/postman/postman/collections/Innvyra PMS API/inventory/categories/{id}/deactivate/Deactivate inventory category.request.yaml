$kind: http-request
description: Deactivates category if no items are currently assigned to it.
url: "{{baseUrl}}/inventory/categories/:id/deactivate"
method: PATCH
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: Required custom header for CSRF protection on mutating requests.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unsigned BIGINT decimal string",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "1"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Deactivate inventory category.resources/examples
order: 1000
