$kind: http-request
description: "Roles: ADMIN, MANAGER. Requires X-CSRF-Protection: 1. Current stock starts at 0.00 and cannot be set directly."
url: "{{baseUrl}}/inventory/items"
method: POST
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: Required custom header for CSRF protection on mutating requests.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "ITEM-SHAMPOO",
      "name": "Dầu gội mini 30ml",
      "categoryId": "1",
      "unit": "bottle",
      "description": "string",
      "minStockLevel": "50.00"
    }
  $type: |-
    {
      "description": "Creates a new inventory item. Initial current stock is always 0.00 and cannot be set directly.",
      "type": "object",
      "properties": {
        "code": {
          "type": "string",
          "minLength": 1,
          "maxLength": 50,
          "example": "ITEM-SHAMPOO"
        },
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 191,
          "example": "Dầu gội mini 30ml"
        },
        "categoryId": {
          "type": "string",
          "example": "1"
        },
        "unit": {
          "type": "string",
          "minLength": 1,
          "maxLength": 30,
          "example": "bottle"
        },
        "description": {
          "type": "string",
          "maxLength": 5000
        },
        "minStockLevel": {
          "type": "string",
          "example": "50.00"
        }
      },
      "required": [
        "code",
        "name",
        "categoryId",
        "unit"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Create inventory item.resources/examples
order: 1000
