$kind: http-request
description: "Roles: ADMIN, MANAGER, ACCOUNTANT, HOUSEKEEPING, TECHNICIAN. Supports search, category filter, stock status filter, and pagination."
url: "{{baseUrl}}/inventory/items?page=1&limit=20&search=string&categoryId=1&isActive=true&stockStatus=ALL"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1
          }
        }
      }
  - key: limit
    value: "20"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
  - key: search
    value: string
    disabled: false
    description: ""
    $type: string
  - key: categoryId
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Unsigned BIGINT decimal string",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "1"
          }
        }
      }
  - key: isActive
    value: "true"
    disabled: false
    description: ""
    $type: boolean
  - key: stockStatus
    value: ALL
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "ALL",
            "enum": [
              "ALL",
              "IN_STOCK",
              "LOW_STOCK",
              "OUT_OF_STOCK"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/List inventory items.resources/examples
order: 2000
