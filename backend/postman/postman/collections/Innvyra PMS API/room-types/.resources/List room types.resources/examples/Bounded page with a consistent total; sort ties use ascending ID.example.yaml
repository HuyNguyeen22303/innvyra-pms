$kind: http-example
name: Bounded page with a consistent total; sort ties use ascending ID.
request:
  url: "{{baseUrl}}/room-types?page=1&limit=20&search=string&isActive=false&sortOrder=asc&sortBy=name"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Decimal integer 1–1000000; default 1.
    - key: limit
      value: "20"
      disabled: false
      description: Decimal integer 1–100; default 20.
    - key: search
      value: string
      disabled: false
      description: ""
    - key: isActive
      value: "false"
      disabled: false
      description: Literal true or false. Omitted includes active and inactive records.
    - key: sortOrder
      value: asc
      disabled: false
      description: ""
    - key: sortBy
      value: name
      disabled: false
      description: ""
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Room types retrieved",
        "data": {
          "items": [
            {
              "id": "3",
              "hotelId": "1",
              "code": "DLX",
              "name": "Deluxe",
              "description": "Deluxe room",
              "maxAdults": 2,
              "maxChildren": 1,
              "basePrice": "900000.00",
              "isActive": true,
              "createdAt": "2026-10-14T00:00:00.000Z",
              "updatedAt": "2026-10-14T00:00:00.000Z"
            }
          ],
          "pagination": {
            "page": 1,
            "limit": 20,
            "total": 1,
            "totalPages": 1
          }
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "items": {
                "type": "array",
                "items": {
                  "type": "object",
                  "example": {
                    "id": "3",
                    "hotelId": "1",
                    "code": "DLX",
                    "name": "Deluxe",
                    "description": "Deluxe room",
                    "maxAdults": 2,
                    "maxChildren": 1,
                    "basePrice": "900000.00",
                    "isActive": true,
                    "createdAt": "2026-10-14T00:00:00.000Z",
                    "updatedAt": "2026-10-14T00:00:00.000Z"
                  },
                  "properties": {
                    "code": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 30,
                      "pattern": "^[A-Z0-9][A-Z0-9_-]*$"
                    },
                    "name": {
                      "type": "string",
                      "minLength": 1,
                      "maxLength": 100
                    },
                    "description": {
                      "type": "string",
                      "maxLength": 10000
                    },
                    "maxAdults": {
                      "type": "integer",
                      "minimum": 1,
                      "maximum": 65535
                    },
                    "maxChildren": {
                      "type": "integer",
                      "minimum": 0,
                      "maximum": 65535
                    },
                    "basePrice": {
                      "type": "string",
                      "pattern": "^[0-9]{1,12}\\.[0-9]{2}$",
                      "example": "900000.00"
                    },
                    "isActive": {
                      "type": "boolean"
                    },
                    "id": {
                      "type": "string",
                      "pattern": "^[1-9][0-9]{0,19}$",
                      "example": "1",
                      "description": "Positive unsigned BIGINT, maximum 18446744073709551615"
                    },
                    "hotelId": {
                      "type": "string",
                      "pattern": "^[1-9][0-9]{0,19}$",
                      "example": "1",
                      "description": "Positive unsigned BIGINT, maximum 18446744073709551615"
                    },
                    "createdAt": {
                      "type": "string",
                      "format": "date-time"
                    },
                    "updatedAt": {
                      "type": "string",
                      "format": "date-time"
                    }
                  },
                  "required": [
                    "id",
                    "hotelId",
                    "code",
                    "name",
                    "description",
                    "maxAdults",
                    "maxChildren",
                    "basePrice",
                    "isActive",
                    "createdAt",
                    "updatedAt"
                  ]
                }
              },
              "pagination": {
                "type": "object",
                "properties": {
                  "page": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "limit": {
                    "type": "integer",
                    "minimum": 1,
                    "maximum": 100
                  },
                  "total": {
                    "type": "integer",
                    "minimum": 0
                  },
                  "totalPages": {
                    "type": "integer",
                    "minimum": 0
                  }
                },
                "required": [
                  "page",
                  "limit",
                  "total",
                  "totalPages"
                ]
              }
            },
            "required": [
              "items",
              "pagination"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
