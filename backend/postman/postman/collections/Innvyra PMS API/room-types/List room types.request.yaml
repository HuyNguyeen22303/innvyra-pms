$kind: http-request
description: "Roles: ADMIN, MANAGER, RECEPTIONIST, HOUSEKEEPING, ACCOUNTANT, TECHNICIAN. Data is scoped to the authenticated user's current hotel, including ADMIN. Unknown query parameters are rejected. No occupancy or date availability is calculated."
url: "{{baseUrl}}/room-types?page=1&limit=20&search=string&isActive=true&sortOrder=asc&sortBy=name"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Decimal integer 1–1000000; default 1.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1,
            "maximum": 1000000
          }
        }
      }
  - key: limit
    value: "20"
    disabled: false
    description: Decimal integer 1–100; default 20.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
  - key: search
    value: string
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          }
        }
      }
  - key: isActive
    value: "true"
    disabled: false
    description: Literal true or false. Omitted includes active and inactive records.
    $type: boolean
  - key: sortOrder
    value: asc
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "asc",
            "enum": [
              "asc",
              "desc"
            ]
          }
        }
      }
  - key: sortBy
    value: name
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "name",
            "enum": [
              "name",
              "basePrice",
              "createdAt"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/List room types.resources/examples
order: 1000
