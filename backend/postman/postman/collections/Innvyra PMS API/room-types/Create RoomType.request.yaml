$kind: http-request
description: "Roles: ADMIN, MANAGER. Hotel comes only from the authenticated user. Other roles receive 403. POST/PATCH/DELETE require X-CSRF-Protection: 1. No hard delete and no reservation/stay records are modified."
url: "{{baseUrl}}/room-types"
method: POST
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: Required for writes; browser Origin must be allowlisted.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "code": "DLX",
      "name": "Deluxe",
      "maxAdults": 2,
      "maxChildren": 1,
      "basePrice": "900000.00"
    }
  $type: |-
    {
      "description": "Code is trimmed and uppercased. At least one adult; children may be zero. Price is a decimal string, never a JSON number. Unknown fields (including hotelId) are rejected.",
      "type": "object",
      "properties": {
        "code": {
          "type": "string",
          "minLength": 1,
          "maxLength": 30,
          "pattern": "^[A-Z0-9][A-Z0-9_-]*$"
        },
        "name": {
          "type": "string",
          "minLength": 1,
          "maxLength": 100
        },
        "description": {
          "type": "string",
          "maxLength": 10000
        },
        "maxAdults": {
          "type": "integer",
          "minimum": 1,
          "maximum": 65535
        },
        "maxChildren": {
          "type": "integer",
          "minimum": 0,
          "maximum": 65535
        },
        "basePrice": {
          "type": "string",
          "pattern": "^(0|[1-9]\\d{0,11})(\\.\\d{1,2})?$"
        },
        "isActive": {
          "type": "boolean"
        }
      },
      "required": [
        "code",
        "name",
        "maxAdults",
        "basePrice"
      ]
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Create RoomType.resources/examples
order: 2000
