$kind: http-example
request:
  url: "{{baseUrl}}/auth/me"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "string",
        "data": {
          "id": "1",
          "fullName": "System Administrator",
          "username": "admin",
          "email": "string",
          "role": "ACCOUNTANT",
          "hotelId": "1",
          "isActive": true
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "pattern": "^[0-9]+$",
                "example": "1"
              },
              "fullName": {
                "type": "string",
                "example": "System Administrator"
              },
              "username": {
                "type": "string",
                "example": "admin"
              },
              "email": {
                "type": "string"
              },
              "role": {
                "type": "string",
                "enum": [
                  "ADMIN",
                  "MANAGER",
                  "RECEPTIONIST",
                  "HOUSEKEEPING",
                  "ACCOUNTANT",
                  "TECHNICIAN"
                ]
              },
              "hotelId": {
                "type": "string",
                "pattern": "^[0-9]+$",
                "example": "1"
              },
              "isActive": {
                "type": "boolean"
              }
            },
            "required": [
              "id",
              "fullName",
              "username",
              "email",
              "role",
              "hotelId",
              "isActive"
            ]
          }
        }
      }
order: 1000
