$kind: http-example
name: Success. Refresh token is set only in the HttpOnly cookie.
request:
  url: "{{baseUrl}}/auth/refresh"
  method: POST
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: Required custom header for CSRF protection. Browser Origin must be allowlisted.
    - key: Accept
      value: application/json
    - key: innvyra_refresh
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    - key: Content-Type
      value: application/json
    - key: Set-Cookie
      value: string
      disabled: false
      description: innvyra_refresh; HttpOnly; Path=/api/v1/auth; SameSite per configuration; Secure in production
      $type: string
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "string",
        "data": {
          "accessToken": "string",
          "tokenType": "Bearer",
          "expiresIn": 900,
          "user": {
            "id": "1",
            "fullName": "System Administrator",
            "username": "admin",
            "email": "string",
            "role": "ACCOUNTANT",
            "hotelId": "1",
            "isActive": true
          }
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "accessToken": {
                "type": "string"
              },
              "tokenType": {
                "type": "string",
                "enum": [
                  "Bearer"
                ]
              },
              "expiresIn": {
                "type": "integer",
                "example": 900
              },
              "user": {
                "type": "object",
                "properties": {
                  "id": {
                    "type": "string",
                    "pattern": "^[0-9]+$",
                    "example": "1"
                  },
                  "fullName": {
                    "type": "string",
                    "example": "System Administrator"
                  },
                  "username": {
                    "type": "string",
                    "example": "admin"
                  },
                  "email": {
                    "type": "string"
                  },
                  "role": {
                    "type": "string",
                    "enum": [
                      "ADMIN",
                      "MANAGER",
                      "RECEPTIONIST",
                      "HOUSEKEEPING",
                      "ACCOUNTANT",
                      "TECHNICIAN"
                    ]
                  },
                  "hotelId": {
                    "type": "string",
                    "pattern": "^[0-9]+$",
                    "example": "1"
                  },
                  "isActive": {
                    "type": "boolean"
                  }
                },
                "required": [
                  "id",
                  "fullName",
                  "username",
                  "email",
                  "role",
                  "hotelId",
                  "isActive"
                ]
              }
            },
            "required": [
              "accessToken",
              "tokenType",
              "expiresIn",
              "user"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
