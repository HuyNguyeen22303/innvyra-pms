$kind: http-request
url: "{{baseUrl}}/auth/logout"
method: POST
headers:
  X-CSRF-Protection: "1"
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: pm.test('Logout succeeds', () => pm.response.to.have.status(200));
    language: text/javascript
order: 5000
