$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
  X-CSRF-Protection: "1"
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login succeeds', () => pm.response.to.have.status(200));
      if (pm.response.code === 200) pm.collectionVariables.set('accessToken', pm.response.json().data.accessToken);
    language: text/javascript
order: 1000
