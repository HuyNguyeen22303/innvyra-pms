$kind: http-example
request:
  url: "{{baseUrl}}/room-types"
  method: POST
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: Required for writes; browser Origin must be allowlisted.
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  body:
    type: json
    content: |-
      {
        "code": "DLX",
        "name": "Deluxe",
        "maxAdults": 2,
        "maxChildren": 1,
        "basePrice": "900000.00"
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Room type created",
        "data": {
          "id": "3",
          "hotelId": "1",
          "code": "DLX",
          "name": "Deluxe",
          "description": "Deluxe room",
          "maxAdults": 2,
          "maxChildren": 1,
          "basePrice": "900000.00",
          "isActive": true,
          "createdAt": "2026-10-14T00:00:00.000Z",
          "updatedAt": "2026-10-14T00:00:00.000Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "example": {
              "id": "3",
              "hotelId": "1",
              "code": "DLX",
              "name": "Deluxe",
              "description": "Deluxe room",
              "maxAdults": 2,
              "maxChildren": 1,
              "basePrice": "900000.00",
              "isActive": true,
              "createdAt": "2026-10-14T00:00:00.000Z",
              "updatedAt": "2026-10-14T00:00:00.000Z"
            },
            "properties": {
              "code": {
                "type": "string",
                "minLength": 1,
                "maxLength": 30,
                "pattern": "^[A-Z0-9][A-Z0-9_-]*$"
              },
              "name": {
                "type": "string",
                "minLength": 1,
                "maxLength": 100
              },
              "description": {
                "type": "string",
                "maxLength": 10000
              },
              "maxAdults": {
                "type": "integer",
                "minimum": 1,
                "maximum": 65535
              },
              "maxChildren": {
                "type": "integer",
                "minimum": 0,
                "maximum": 65535
              },
              "basePrice": {
                "type": "string",
                "pattern": "^[0-9]{1,12}\\.[0-9]{2}$",
                "example": "900000.00"
              },
              "isActive": {
                "type": "boolean"
              },
              "id": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "1",
                "description": "Positive unsigned BIGINT, maximum 18446744073709551615"
              },
              "hotelId": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "1",
                "description": "Positive unsigned BIGINT, maximum 18446744073709551615"
              },
              "createdAt": {
                "type": "string",
                "format": "date-time"
              },
              "updatedAt": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "hotelId",
              "code",
              "name",
              "description",
              "maxAdults",
              "maxChildren",
              "basePrice",
              "isActive",
              "createdAt",
              "updatedAt"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
