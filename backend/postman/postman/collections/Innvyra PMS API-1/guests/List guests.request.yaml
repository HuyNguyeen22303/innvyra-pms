$kind: http-request
description: "Roles: ADMIN, MANAGER, RECEPTIONIST, ACCOUNTANT. Every role, including ADMIN, is scoped to the current hotel from the authenticated session. ACCOUNTANT receives only id/fullName and cannot filter by nationality. HOUSEKEEPING and TECHNICIAN receive 403. Soft-deleted and foreign-hotel IDs have the same 404 as unknown IDs. Cache-Control: no-store. Lists omit DOB, gender, documents, address and notes. Stable sorting uses ascending ID for ties. Unknown or repeated query parameters are rejected."
url: "{{baseUrl}}/guests?page=1&limit=20&search=string&nationality=string&status=ACTIVE&sortBy=fullName&sortOrder=asc"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: page
    value: "1"
    disabled: false
    description: Page number
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 1,
            "minimum": 1,
            "maximum": 1000000
          }
        }
      }
  - key: limit
    value: "20"
    disabled: false
    description: Bounded page size
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "integer",
            "default": 20,
            "minimum": 1,
            "maximum": 100
          }
        }
      }
  - key: search
    value: string
    disabled: false
    description: Contains fullName, using database collation
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 150
          }
        }
      }
  - key: nationality
    value: string
    disabled: false
    description: Exact nationality; not available to ACCOUNTANT
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "minLength": 1,
            "maxLength": 100
          }
        }
      }
  - key: status
    value: ACTIVE
    disabled: false
    description: Only non-deleted profiles are exposed; deleted-profile browsing is not supported
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "ACTIVE",
            "enum": [
              "ACTIVE"
            ]
          }
        }
      }
  - key: sortBy
    value: fullName
    disabled: false
    description: Sort whitelist
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "fullName",
            "enum": [
              "fullName",
              "createdAt"
            ]
          }
        }
      }
  - key: sortOrder
    value: asc
    disabled: false
    description: Sort direction
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "asc",
            "enum": [
              "asc",
              "desc"
            ]
          }
        }
      }
body:
  type: text
  content: ""
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/List guests.resources/examples
order: 1000
