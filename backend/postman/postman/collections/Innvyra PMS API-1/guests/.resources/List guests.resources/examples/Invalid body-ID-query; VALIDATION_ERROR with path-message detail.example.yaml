$kind: http-example
name: Invalid body/ID/query; VALIDATION_ERROR with path/message details
request:
  url: "{{baseUrl}}/guests?page=1&limit=20&search=string&nationality=string&status=ACTIVE&sortBy=fullName&sortOrder=asc"
  method: GET
  headers:
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  queryParams:
    - key: page
      value: "1"
      disabled: false
      description: Page number
    - key: limit
      value: "20"
      disabled: false
      description: Bounded page size
    - key: search
      value: string
      disabled: false
      description: Contains fullName, using database collation
    - key: nationality
      value: string
      disabled: false
      description: Exact nationality; not available to ACCOUNTANT
    - key: status
      value: ACTIVE
      disabled: false
      description: Only non-deleted profiles are exposed; deleted-profile browsing is not supported
    - key: sortBy
      value: fullName
      disabled: false
      description: Sort whitelist
    - key: sortOrder
      value: asc
      disabled: false
      description: Sort direction
  body:
    type: text
    content: ""
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": false,
        "message": "string",
        "error": {
          "code": "string",
          "details": [
            {
              "path": "string",
              "message": "string"
            },
            {
              "path": "string",
              "message": "string"
            }
          ]
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              false
            ]
          },
          "message": {
            "type": "string"
          },
          "error": {
            "type": "object",
            "properties": {
              "code": {
                "type": "string"
              },
              "details": {
                "type": "array",
                "items": {
                  "type": "object",
                  "properties": {
                    "path": {
                      "type": "string"
                    },
                    "message": {
                      "type": "string"
                    }
                  }
                }
              }
            },
            "required": [
              "code"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "error"
        ]
      }
order: 4000
