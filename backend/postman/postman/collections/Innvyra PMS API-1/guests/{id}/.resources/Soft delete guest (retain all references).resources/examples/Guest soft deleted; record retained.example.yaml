$kind: http-example
request:
  url: "{{baseUrl}}/guests/:id"
  method: DELETE
  headers:
    - key: X-CSRF-Protection
      value: "1"
      disabled: false
      description: ""
    - key: Accept
      value: application/json
    - key: Authorization
      value: Bearer <token>
      description: "Added as a part of security scheme: bearer"
  pathVariables:
    id: "42"
  body:
    type: text
    content: ""
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "success": true,
        "message": "Guest soft deleted; record retained",
        "data": {
          "id": "42",
          "deletedAt": "2026-10-14T00:00:00.000Z"
        }
      }
    $type: |-
      {
        "type": "object",
        "properties": {
          "success": {
            "type": "boolean",
            "enum": [
              true
            ]
          },
          "message": {
            "type": "string"
          },
          "data": {
            "type": "object",
            "properties": {
              "id": {
                "type": "string",
                "pattern": "^[1-9][0-9]{0,19}$",
                "example": "42",
                "description": "Unsigned BIGINT decimal string, maximum 18446744073709551615"
              },
              "deletedAt": {
                "type": "string",
                "format": "date-time"
              }
            },
            "required": [
              "id",
              "deletedAt"
            ]
          }
        },
        "required": [
          "success",
          "message",
          "data"
        ]
      }
order: 1000
