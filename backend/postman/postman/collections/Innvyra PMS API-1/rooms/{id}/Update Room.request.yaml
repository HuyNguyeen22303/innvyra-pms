$kind: http-request
description: "Roles: ADMIN, MANAGER. Hotel comes only from the authenticated user. Other roles receive 403. POST/PATCH/DELETE require X-CSRF-Protection: 1. No hard delete and no reservation/stay records are modified. Sets isActive=false and retains the record and references. Repeating succeeds. Physical/housekeeping status is unchanged. Reservation/stay conflict checks are deferred until those tables and workflows exist in a later phase."
url: "{{baseUrl}}/rooms/:id"
method: PATCH
headers:
  - key: X-CSRF-Protection
    value: "1"
    disabled: false
    description: Required for writes; browser Origin must be allowlisted.
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "type": "string",
            "default": "1",
            "enum": [
              "1"
            ]
          }
        },
        "required": [
          "value"
        ]
      }
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
pathVariables:
  - key: id
    value: "1"
    disabled: false
    description: ""
    $type: |-
      {
        "type": "object",
        "properties": {
          "value": {
            "description": "Positive unsigned BIGINT, maximum 18446744073709551615",
            "type": "string",
            "pattern": "^[1-9][0-9]{0,19}$",
            "example": "1"
          }
        },
        "required": [
          "value"
        ]
      }
body:
  type: json
  content: |-
    {
      "housekeepingStatus": "READY"
    }
  $type: |-
    {
      "description": "Partial update. Reassignment and reactivation require an active room type in the same hotel.",
      "type": "object",
      "properties": {
        "roomNumber": {
          "type": "string",
          "minLength": 1,
          "maxLength": 20,
          "pattern": "^[^\\u0000-\\u001f\\u007f]+$"
        },
        "floorNumber": {
          "type": "integer",
          "minimum": -32768,
          "maximum": 32767
        },
        "roomTypeId": {
          "type": "string",
          "pattern": "^[1-9]\\d{0,19}$"
        },
        "physicalStatus": {
          "type": "string",
          "enum": [
            "ACTIVE",
            "OUT_OF_SERVICE",
            "MAINTENANCE"
          ]
        },
        "housekeepingStatus": {
          "type": "string",
          "enum": [
            "DIRTY",
            "CLEANING",
            "INSPECTION",
            "READY"
          ]
        },
        "notes": {
          "type": "string",
          "maxLength": 10000
        },
        "isActive": {
          "type": "boolean"
        }
      }
    }
auth:
  type: bearer
  credentials:
    token: "{{bearerToken}}"
settings: {}
examples: ./.resources/Update Room.resources/examples
order: 2000
